name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Build redflag app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: redflag/package-lock.json

      - name: Install and build redflag
        working-directory: redflag
        run: |
          npm ci
          npm run build

      # Prepare site: copy root static files + redflag build
      - name: Prepare site
        run: |
          mkdir -p _site/redflag
          cp -r index.html CNAME README.md _site/ 2>/dev/null || true
          cp -r "google search console verify.html" _site/ 2>/dev/null || true
          cp -r fiverr_previews.html _site/ 2>/dev/null || true
          cp -r project _site/ 2>/dev/null || true
          cp -r redflag/dist/* _site/redflag/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
